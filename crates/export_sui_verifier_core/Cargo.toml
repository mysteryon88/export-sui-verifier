[package]
name = "export-sui-verifier-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Load Groth16 artifacts from snarkjs JSON or Arkworks bundles and generate Sui Move verifier packages."
readme = "README.md"
keywords = ["sui", "groth16", "verifier", "zk", "cryptography"]
categories = ["cryptography"]
exclude = ["/tests/**", "/target"]

[dependencies]
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.5", features = ["serde"] }
hex = "0.4"
handlebars = "6.4.1"
sha2 = "0.11"
tempfile = "3"

ark-std = "0.6.0"
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-serialize = "0.6.0"
ark-bn254 = "0.6.0"
ark-bls12-381 = "0.6.0"
ark-groth16 = "0.6.0"


[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_Security", "Win32_Security_Authorization"] }
